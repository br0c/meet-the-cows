name: Build data pack

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_pack.py"
      - "scripts/packs.py"
      - "scripts/smoke_test_pack.py"
      - "requirements.txt"
      - ".github/workflows/build-data-pack.yml"
      # Merging a community-contribution PR must rebuild + redeploy the pack.
      - "contributions/**"
      # In-repo pack sources (e.g. the APVV Pyrenees guide extraction) work like
      # contributions: editing them must rebuild + redeploy.
      - "data/sources/**"
  workflow_dispatch:
    inputs:
      force_full:
        description: "Rebuild everything, ignoring the incremental short-circuit"
        type: boolean
        default: true
  schedule:
    # Daily at 03:17 UTC (incremental Mon-Sat; full refresh on Sunday)
    - cron: "17 3 * * *"

permissions:
  contents: write  # push the updated translation cache back to main (see "Persist translation cache")
  pages: write
  id-token: write
  actions: write

# Its own group, not one shared with deploy-app. They used to share `pages-deploy` because both
# published an app shell and must not have raced each other to publish it. That reason is gone —
# the shell now goes to a Worker, deployed by deploy-app alone — and sharing it had a cost: a
# merge that touched both the app and the pack builder queued the app BEHIND a full rebuild, so
# a fix a pilot was waiting on sat pending for as long as the data took. That happened with the
# terrain-clearance fix. Separate groups let the app ship in minutes while the data takes its
# time; each still serialises against itself, which is the part that matters.
#
# The one assumption: with DEPLOY_TARGET=cloudflare the two write to different places —
# this one to the R2 bucket, deploy-app to the Worker. Both still carry GitHub Pages steps
# for the non-Cloudflare configuration, and under THAT setting they would both publish to
# the repo's single Pages site. If DEPLOY_TARGET ever goes back, put them on one group again.
concurrency:
  group: data-pack-build
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          # Ghostscript recompresses oversized chart/briefing PDFs (optimize_pdf_bytes).
          sudo apt-get install -y --no-install-recommends ghostscript

      - name: Unit tests (name/translation/incremental logic)
        run: python scripts/test_build_pack_fixes.py

      # Same gate as deploy-app.yml: this workflow also ships the app shell, so it must not
      # deploy a version whose APP_VERSIONs drifted or whose release note is missing.
      - name: Check APP_VERSION consistency and release note
        run: |
          app=$(grep -o "APP_VERSION = '[^']*'" src/app.js | head -1)
          sw=$(grep -o "APP_VERSION = '[^']*'" service-worker.js | head -1)
          [ -n "${app}" ] && [ "${app}" = "${sw}" ] || { echo "ERROR: APP_VERSION mismatch"; exit 1; }
          version=$(echo "${app}" | sed "s/.*'\(.*\)'/\1/")
          jq -e --arg v "${version}" '.[] | select(.version == $v)' release-notes.json > /dev/null \
            || { echo "ERROR: release-notes.json has no entry for ${version} — write the release note first"; exit 1; }
          echo "release note present for ${version}"

      # Incremental by default: the build short-circuits when the source fingerprint AND
      # PACK_SCHEMA_VERSION match the published state.json, so pushes/crons that change nothing
      # in the pack skip the rebuild+deploy. Full rebuild only on the Sunday weekly refresh
      # and on manual dispatch with force_full.
      # IMPORTANT: bump PACK_SCHEMA_VERSION in build_pack.py when a code change alters pack
      # output, otherwise a push may short-circuit and not deploy your change.
      - name: Decide build mode
        id: mode
        run: |
          FORCE=false
          case "${{ github.event_name }}" in
            workflow_dispatch) FORCE="${{ github.event.inputs.force_full }}" ;;
            schedule) [ "$(date -u +%u)" = "7" ] && FORCE=true ;;
          esac
          echo "force_full=${FORCE}" >> "$GITHUB_OUTPUT"
          echo "Build mode: force_full=${FORCE} (event=${{ github.event_name }})"

      # One workflow, two data channels. From main this is the production pipeline it always
      # was. Dispatched on any other ref it becomes the DEV data build: same sources, same
      # builder, published under dev/ on the same bucket — next.meetthecows.org points there
      # via PACKS_BASE_URL_DEV (see deploy-app.yml) — and every production-only step below is
      # gated on `prod`. Those gates are also what make running from dev safe at all: the
      # translation-cache step pushes HEAD to main, which from a dev checkout would have
      # merged the whole branch.
      #
      # Dev builds run WITHOUT the DeepL key (its lifetime quota is spent once, by main) and
      # instead union-merge production's published cache, so dev packs carry every translation
      # main has already paid for and plain dictionary text only for genuinely new strings.
      - name: Resolve data channel
        id: channel
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "prod=true"             >> "$GITHUB_OUTPUT"
            echo "prefix=packs"          >> "$GITHUB_OUTPUT"
            echo "chart_prefix=vac"      >> "$GITHUB_OUTPUT"
            echo "chart_key_prefix="     >> "$GITHUB_OUTPUT"
          else
            echo "prod=false"            >> "$GITHUB_OUTPUT"
            echo "prefix=dev/packs"      >> "$GITHUB_OUTPUT"
            echo "chart_prefix=dev/vac"  >> "$GITHUB_OUTPUT"
            echo "chart_key_prefix=dev/" >> "$GITHUB_OUTPUT"
          fi
          echo "Data channel: $([ "${{ github.ref }}" = "refs/heads/main" ] && echo production || echo "dev (${{ github.ref_name }})")"

      # Persist translations so each build only pays DeepL for new/changed text. Three layers,
      # freshest first — the DeepL key is a capped lifetime quota, so losing this cache burns
      # quota that cannot be bought back:
      #   1. Actions cache (below): fast path, but evictable (7-day idle / 10 GB repo cap, under
      #      constant pressure from the multi-GB pages-pack-* entries saved each build).
      #   2. data/translation-cache.json in git: durable + versioned; committed back after each
      #      successful build ("Persist translation cache" step).
      #   3. translation-cache.json published next to each pack (self-heal in build_pack.py).
      - name: Restore translation cache
        uses: actions/cache@v6
        with:
          path: .cache/translation-cache.json
          key: translation-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            translation-cache-

      - name: Seed translation cache from repo copy (if CI cache evicted)
        run: |
          if [ ! -f .cache/translation-cache.json ] && [ -f data/translation-cache.json ]; then
            mkdir -p .cache
            cp data/translation-cache.json .cache/translation-cache.json
            echo "CI cache was evicted; seeded from data/translation-cache.json ($(wc -c < .cache/translation-cache.json) bytes)"
          fi

      # Italian charts sit behind ENAV's login, so they are fetched by a Playwright step and
      # handed to the build as a local directory (--it-vac-dir). The directory is cached across
      # runs: a browserless --check-only probe compares the portal's current AIRAC cycle against
      # the cached manifest, and when it matches, the Chromium install AND the ~250 downloads are
      # both skipped (the common nightly case). An ENAV outage must not sink the nightly build —
      # the fetch soft-fails and the build then runs without Italian charts (they return with
      # the next successful fetch).
      - name: Restore ENAV charts cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/enav-charts
          key: enav-charts-${{ hashFiles('.cache/enav-charts/manifest.json') }}
          restore-keys: |
            enav-charts-

      - name: Fetch Italian charts (ENAV, authenticated)
        env:
          ENAV_ACCOUNT_ID: ${{ secrets.ENAV_ACCOUNT_ID }}
          ENAV_ACCOUNT_PASSWORD: ${{ secrets.ENAV_ACCOUNT_PASSWORD }}
        run: |
          python -m pip install --quiet playwright
          if python scripts/fetch_enav_charts.py --check-only --out .cache/enav-charts; then
            echo "ENAV cache is current for the portal's AIRAC cycle; skipping browser fetch."
          else
            python -m playwright install --with-deps chromium
            python scripts/fetch_enav_charts.py --out .cache/enav-charts \
              || echo "::warning::ENAV fetch failed; building without Italian charts"
          fi

      # Save keyed on the manifest hash: unchanged cycle -> same key -> no redundant multi-hundred-
      # megabyte cache entry each run (the old run_id key saved a new copy every night, evicting
      # the DeepL translation cache). A fresh fetch changes the manifest, producing a new key.
      - name: Save ENAV charts cache
        if: hashFiles('.cache/enav-charts/manifest.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .cache/enav-charts
          key: enav-charts-${{ hashFiles('.cache/enav-charts/manifest.json') }}

      # All other source downloads (AT AIP ZIP, OpenAIP, the CUP guide, the DFS crawl, SIA PDFs)
      # share one on-disk cache (raw_dir) so a rebuild triggered by ONE
      # changed source does not re-fetch the rest. Restore the most recent copy; the build reuses
      # each artifact whose AIRAC cycle still matches and prunes the ones that have rolled.
      - name: Restore source download cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/_multi/raw
          key: raw-src-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            raw-src-

      - name: Build data pack
        id: build
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
          # Prod only: the DeepL key is a lifetime quota, spent once by main. Dev builds
          # inherit main's translations via TRANSLATION_MERGE_URL below and use dictionary
          # text for anything genuinely new (which main then translates properly on merge).
          DEEPL_API_KEY: ${{ steps.channel.outputs.prod == 'true' && secrets.DEEPL_API_KEY || '' }}
          # Lifetime (developer-tier) DeepL key: disable the per-build character cap so a full
          # rebuild — such as the schema bump that adds three-language notes — can finish
          # translating in one run instead of one 300k chunk per weekly full rebuild. The build
          # is still bounded by the remaining lifetime quota, and translations are cached, so
          # this is a one-time cost; routine incremental rebuilds spend almost nothing.
          DEEPL_MAX_CHARS: "0"
          # Incremental check + translation-cache self-heal read one pack's state; the fingerprint
          # is identical across packs, so any pack works. Use the France pack as the canonical one
          # (stable id — the Alps pack was split into alps-west/alps-east in schema 14).
          # Read from the live data origin, per channel. It pointed at the GitHub Pages copy
          # before — frozen since the Cloudflare migration, so the URL 404s, every state
          # comparison failed, and every nightly was silently a FULL rebuild. The Pages URL
          # remains only as the fallback for a non-Cloudflare deployment, where it is live.
          PACK_STATE_URL: ${{ vars.PACKS_BASE_URL != '' && format('{0}{1}/fr/state.json', vars.PACKS_BASE_URL, steps.channel.outputs.prefix) || format('{0}packs/fr/state.json', env.PAGES_BASE_URL) }}
          # Dev channel: union-merge production's published translation cache (see
          # merge_translation_cache_from_url) — always from the PROD prefix, that is the point.
          TRANSLATION_MERGE_URL: ${{ steps.channel.outputs.prod != 'true' && vars.PACKS_BASE_URL != '' && format('{0}packs/fr/translation-cache.json', vars.PACKS_BASE_URL) || '' }}
          # Namespaces chart keys (and their bucket objects) per channel: dev stamps dev/vac/…
          # so a dev build can never overwrite a chart object production apps are reading.
          MTC_CHART_KEY_PREFIX: ${{ steps.channel.outputs.chart_key_prefix }}
          FORCE_FULL: ${{ steps.mode.outputs.force_full }}
          # Never trust a stable-URL source (a CUP, OpenAIP) by age alone: with the download
          # cache persisted across runs, the TTL window lets a rebuild pair OLD bytes with the
          # NEW fingerprint, and the mismatch then masks itself until the Sunday force-full.
          # See SOURCE_CACHE_TTL_S in build_pack.py. Revalidation is a conditional GET — an
          # unchanged source costs a 304, not a download.
          MTC_SOURCE_TTL_S: "0"
        run: |
          # Keep .cache/_multi/raw (the restored source-download cache); only the pack output
          # and the site staging are rebuilt from scratch each run.
          rm -rf data/packs dist/site

          # Multi-pack: one merged, translated build sliced into FR/CH/DE/IT/AT + Alps. Country
          # lists are forced to all build countries by --multi-pack, so they are not passed here.
          # --keep-raw: without it the build deletes .cache/_multi at the end, taking
          # .source-versions.json with it — the "Save source download cache" step's hashFiles()
          # condition then never matched, so the cache that reached the next run was 502 bytes
          # of marker from a skipped build, and every real rebuild re-downloaded everything
          # (~450 MB AT ZIP, the 375-PDF DFS crawl, the SIA PDFs — ~18 of the ~19 minutes).
          python scripts/build_pack.py \
            --keep-raw \
            --multi-pack \
            --out data/packs \
            --cupx https://raw.githubusercontent.com/planeur-net/outlanding/main/guide_aires_securite.cupx \
            --champs-cupx https://raw.githubusercontent.com/planeur-net/outlanding/main/champs_des_alpes.cupx \
            --basulm-cupx https://raw.githubusercontent.com/planeur-net/outlanding/main/basulm_terrains.cupx \
            --airfield-source openaip \
            --vac-root auto \
            --vac-date auto \
            --at-vac-root auto \
            --de-vac-root auto \
            --it-vac-dir .cache/enav-charts \
            --include-vac-airfields

      # Keyed on the AIRAC-cycle markers (.source-versions.json), so unchanged cycles reuse the
      # same key and never re-store the ~450 MB AT ZIP; a cycle roll changes the hash and saves
      # the refreshed downloads once. Only on build success, so a partial/failed run cannot pin
      # the key with an incomplete cache.
      # Prod only: caches saved from a branch are invisible to main, so a dev copy would
      # duplicate the ~450 MB AT ZIP under the branch scope purely as pressure on the 10 GB
      # cap. Dev runs still RESTORE main's cache above, which is the half that matters.
      - name: Save source download cache
        if: success() && hashFiles('.cache/_multi/raw/.source-versions.json') != '' && steps.channel.outputs.prod == 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/_multi/raw
          key: raw-src-${{ hashFiles('.cache/_multi/raw/.source-versions.json') }}

      - name: No source changes (skipped rebuild)
        if: steps.build.outputs.changed == 'false'
        run: echo "No source changes since the last build; kept the existing deployed pack."

      - name: Smoke test packs
        if: steps.build.outputs.changed != 'false'
        run: |
          python scripts/smoke_test_pack.py data/packs/alps-west
          python scripts/smoke_test_pack.py data/packs/alps-east
          python scripts/smoke_test_pack.py data/packs/pyr
          python scripts/smoke_test_pack.py data/packs/es

      # Durable layer 2: commit the updated cache to the repo. Only fires when the build added
      # translations (git diff check), and the commit touches only data/translation-cache.json,
      # which matches no workflow's path filter — so it can never retrigger a build.
      # PROD ONLY, and load-bearing: this step pushes HEAD to main, which from a dev checkout
      # would merge the entire branch. A dev build cannot add translations anyway (no key).
      - name: Persist translation cache to repo
        if: steps.build.outputs.changed != 'false' && steps.channel.outputs.prod == 'true'
        run: |
          [ -f .cache/translation-cache.json ] || { echo "no cache file produced; skipping"; exit 0; }
          cp .cache/translation-cache.json data/translation-cache.json
          git add data/translation-cache.json
          if git diff --cached --quiet; then
            echo "translation cache unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Persist translation cache ($(python -c 'import json;print(len(json.load(open("data/translation-cache.json"))))') entries) [skip ci]"
          # The build can run for an hour+; rebase over anything pushed to main meanwhile.
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          git push origin HEAD:main

      - name: Cache generated data pack for app-only deploys
        if: steps.build.outputs.changed != 'false' && steps.channel.outputs.prod == 'true'
        uses: actions/cache/save@v6
        with:
          path: data/packs
          key: pages-pack-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Assemble Pages site
        if: steps.build.outputs.changed != 'false'
        run: |
          mkdir -p dist/site/packs

          cp index.html styles.css service-worker.js manifest.webmanifest release-notes.json config.js dist/site/
          if [ -d icons ]; then cp -R icons dist/site/icons; fi
          mkdir -p dist/site/src
          cp src/app.js dist/site/src/app.js

          # Every pack dir + the shared media tree (_shared) + packs.json (written by the build).
          cp -R data/packs/. dist/site/packs/

          find dist/site -maxdepth 3 -type f | sort | head -80
          du -sh dist/site dist/site/packs

      # See deploy-app.yml for what each repository variable means; the two workflows must emit
      # the same config so the shell and the packs agree on where data lives.
      - name: Write deployment config
        if: steps.build.outputs.changed != 'false'
        env:
          PACKS_BASE_URL: ${{ vars.PACKS_BASE_URL }}
          CHARTS_BASE_URL: ${{ vars.CHARTS_BASE_URL }}
          # NB: `x == 'main' && '' || x` does NOT work — '' is falsy, so the || arm always
          # wins and every deployment is labelled with its branch. Test the negative instead.
          CHANNEL: ${{ github.ref_name != 'main' && github.ref_name || '' }}
        run: |
          python - <<'PY' > dist/site/config.js
          import json, os
          cfg = {
              "packsBase": os.environ.get("PACKS_BASE_URL", ""),
              "chartsBase": os.environ.get("CHARTS_BASE_URL", ""),
              "channel": os.environ.get("CHANNEL", ""),
          }
          print("// Generated at deploy time — see config.js in the repo for the field docs.")
          print(f"self.MTC_CONFIG = {json.dumps(cfg, indent=2)};")
          PY
          cat dist/site/config.js

      # --- Pack data to R2 (when PACKS_BASE_URL points at a data origin) ----------------------
      # The ~300 MB of packs is uploaded once to the bucket and read by every app deployment,
      # so experimental builds share production data instead of duplicating it. The bucket
      # layout mirrors the site (packs/<id>/…), which is why no build output had to change.
      # --remote writes to the real bucket; only changed objects are re-uploaded.
      - name: Publish packs to R2
        if: steps.build.outputs.changed != 'false' && vars.PACKS_BASE_URL != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUCKET: ${{ vars.R2_PACKS_BUCKET || 'mtc-packs' }}
        run: |
          python -m pip install --quiet boto3
          python scripts/publish_packs_r2.py --dir dist/site/packs --prefix "${{ steps.channel.outputs.prefix }}" --bucket "$BUCKET"

      # --- Charts to the PRIVATE charts bucket ------------------------------------------------
      # Most charts carry no redistribution right (DFS, ENAV), so they are served by the Worker
      # from a private bucket rather than read straight off the public data origin. Keys here
      # are what the pack's chartKey points at: vac/<ICAO>.pdf.
      #
      # The copies in the public pack tree are still published above, on purpose: an app shell
      # cached from before this change resolves the chart's published URL and nothing else, and
      # a pilot mid-season should not lose charts because their phone has not relaunched the
      # app yet. Withdrawing them is a separate, deliberate step once shells have turned over —
      # drop `docs/vac` from the public upload and the public copies stop being refreshed.
      - name: Publish charts to the private R2 bucket
        if: steps.build.outputs.changed != 'false' && vars.CHARTS_BASE_URL != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CHARTS_BUCKET: ${{ vars.R2_CHARTS_BUCKET || 'mtc-charts' }}
        run: |
          if [ -d dist/site/packs/_shared/docs/vac ]; then
            python scripts/publish_packs_r2.py \
              --dir dist/site/packs/_shared/docs/vac \
              --prefix "${{ steps.channel.outputs.chart_prefix }}" \
              --bucket "$CHARTS_BUCKET"
          else
            echo "no charts in this build; nothing to publish"
          fi

      # --- GitHub Pages (default) ------------------------------------------------------------
      - name: Setup Pages
        if: steps.build.outputs.changed != 'false' && vars.DEPLOY_TARGET != 'cloudflare' && steps.channel.outputs.prod == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.build.outputs.changed != 'false' && vars.DEPLOY_TARGET != 'cloudflare' && steps.channel.outputs.prod == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist/site

      - name: Deploy to GitHub Pages
        if: steps.build.outputs.changed != 'false' && vars.DEPLOY_TARGET != 'cloudflare' && steps.channel.outputs.prod == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # No Cloudflare deploy here on purpose. This workflow used to push dist/site to a Cloudflare
      # PAGES project on every rebuild — 25 seconds a run, uploading an app shell that nothing
      # serves: app.meetthecows.org has been a Worker since the migration, deploy-app.yml dropped
      # its own copy of this step then, and this one was simply missed. Removing it also removes
      # the last thing these two workflows both wrote to, which is what let their concurrency
      # groups come apart. The pack data reaches production through "Publish packs to R2" above;
      # the shell reaches it through deploy-app.yml.

      - name: Show URL
        if: steps.build.outputs.changed != 'false'
        run: |
          if [ "${{ vars.DEPLOY_TARGET }}" = "cloudflare" ]; then
            echo "Packs published to R2 (bucket ${{ vars.R2_PACKS_BUCKET || 'mtc-packs' }})."
            echo "The app shell is deployed separately by deploy-app.yml."
          else
            echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
          fi
