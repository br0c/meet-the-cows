name: Deploy app to Pages

on:
  push:
    # main -> production; dev -> the experimental deployment (next.meetthecows.org). Any other
    # branch can still be deployed on demand with workflow_dispatch, which uses that branch's
    # name for its own preview URL.
    branches: [main, dev]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "styles.css"
      - "release-notes.json"
      - "src/**"
      - "icons/**"
      # How the app is served is part of the app: a change here must redeploy, or the config
      # sits in the repo describing something the live site is not doing.
      - "deploy/**"
      - "scripts/apply_channel_branding.py"
      - "scripts/hash_assets.py"
      - "scripts/fetch_pages_pack.py"
      - "scripts/make_pages_pack_index.py"
      - ".github/workflows/deploy-app.yml"
      - ".github/workflows/build-data-pack.yml"
  workflow_dispatch:
    inputs:
      deploy_retired_origin:
        description: "Also deploy to GitHub Pages (br0c.github.io), the retired origin, so its frozen copy learns the app has moved"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PACK_ID: fr-alps
      PACK_NAME: France / Alps
      PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # APP_VERSION is declared in both files (the SW cannot import the module); a mismatch
      # would leave clients on a stale shell cache. Fail fast instead of deploying drift.
      # Every release must also ship its release note: fail when release-notes.json has no
      # entry for the current APP_VERSION.
      - name: Check APP_VERSION consistency and release note
        run: |
          app=$(grep -o "APP_VERSION = '[^']*'" src/app.js | head -1)
          sw=$(grep -o "APP_VERSION = '[^']*'" service-worker.js | head -1)
          echo "src/app.js:        ${app}"
          echo "service-worker.js: ${sw}"
          [ -n "${app}" ] && [ "${app}" = "${sw}" ] || { echo "ERROR: APP_VERSION mismatch"; exit 1; }

          version=$(echo "${app}" | sed "s/.*'\(.*\)'/\1/")
          jq -e --arg v "${version}" '.[] | select(.version == $v)' release-notes.json > /dev/null \
            || { echo "ERROR: release-notes.json has no entry for ${version} — write the release note before deploying"; exit 1; }
          echo "release note present for ${version}"

      # This workflow ALWAYS deploys — it must not defer to build-data-pack.yml. An earlier
      # version skipped itself when data-pack files changed in the same push, assuming the data
      # workflow would deploy the complete site; but that workflow short-circuits when the pack
      # sources are unchanged, and the app shell never shipped (0.7.1-beta went out this way).
      # The shared pages-deploy concurrency group serializes the two workflows, so the rare
      # double deploy on a mixed push is harmless — the later run ships the same packs again.
      # Packs only travel with the app shell while they are served from the same origin. Once
      # PACKS_BASE_URL points at a data host, these two steps would download ~300 MB and upload
      # it again for nothing, so they are skipped and an app deploy becomes a few hundred KB.
      - name: Restore latest generated data pack cache
        if: vars.PACKS_BASE_URL == ''
        uses: actions/cache/restore@v6
        with:
          path: data/packs
          key: pages-pack-${{ github.run_id }}
          restore-keys: |
            pages-pack-

      - name: Restore packs from current Pages deployment when cache is unavailable
        if: vars.PACKS_BASE_URL == ''
        run: |
          if [ -f "data/packs/packs.json" ]; then
            echo "Using cached data packs."
            exit 0
          fi

          # Fetches every pack listed in packs.json plus the shared media tree.
          python3 scripts/fetch_pages_pack.py \
            --base-url "${PAGES_BASE_URL}" \
            --output data/packs

      - name: Assemble Pages site
        run: |
          mkdir -p dist/site

          cp index.html styles.css service-worker.js manifest.webmanifest release-notes.json config.js dist/site/
          if [ -d icons ]; then cp -R icons dist/site/icons; fi
          mkdir -p dist/site/src
          cp src/app.js src/terrain.js src/glide-worker.js dist/site/src/

          # All pack dirs + shared media (_shared) + packs.json — only when packs are served
          # from this origin; otherwise the app reads them from the data host.
          if [ -d data/packs ]; then mkdir -p dist/site/packs && cp -R data/packs/. dist/site/packs/; fi

          find dist/site -maxdepth 3 -type f | sort | head -80
          du -sh dist/site

      # Deployment config is written per environment, overwriting the committed defaults (which
      # stay empty so a local checkout behaves like a plain single-origin site).
      #   PACKS_BASE_URL      data origin for packs, e.g. https://data.meetthecows.org/ ('' = self)
      # The app's own address and the landing site are NOT here — they are constants in
      # src/app.js. A retired origin stops being deployed to, so anything it needs in order to
      # know it is retired has to already be in the shell it is serving.
      - name: Write deployment config
        env:
          PACKS_BASE_URL: ${{ vars.PACKS_BASE_URL }}
          # NB: `x == 'main' && '' || x` does NOT work — '' is falsy, so the || arm always
          # wins and every deployment is labelled with its branch. Test the negative instead.
          CHANNEL: ${{ github.ref_name != 'main' && github.ref_name || '' }}
        run: |
          python - <<'PY' > dist/site/config.js
          import json, os
          cfg = {
              "packsBase": os.environ.get("PACKS_BASE_URL", ""),
              "channel": os.environ.get("CHANNEL", ""),
          }
          print("// Generated at deploy time — see config.js in the repo for the field docs.")
          print(f"self.MTC_CONFIG = {json.dumps(cfg, indent=2)};")
          PY
          cat dist/site/config.js

          # The app shell must never be answered from a stale cache: an update would sit unseen,
          # and a freshly installing service worker would fill its brand-new versioned cache with
          # the previous build's bytes. The shell is a few hundred KB and revalidates to a 304,
          # so there is nothing to save by caching it.
          #
          # The three files that decide the app's IDENTITY — the page, the manifest and the
          # worker — are no-store rather than must-revalidate. max-age=0 was not enough: the edge
          # kept answering HIT anyway, and served index.html and manifest.webmanifest from
          # DIFFERENT deployments at the same moment. An installed app revalidates through its
          # service worker and would have survived that, but a first install has no service
          # worker and reads exactly these files to decide what the app is called and which icon
          # it wears.
          # These rules do apply — meet-the-cows.pages.dev returns max-age=0 — but a Cloudflare
          # cache/page rule scoped to the app.meetthecows.org hostname currently rewrites them to
          # max-age=14400 at the edge, so the service worker's own 'reload' and 'no-cache' fetches
          # are what actually guarantee freshness there. Both belong here: the rules are correct
          # and host-independent, the worker is the one that cannot be overridden from a dashboard.
          cat > dist/site/_headers <<'HEADERS'
          /
            Cache-Control: no-store
          /index.html
            Cache-Control: no-store
          /manifest.webmanifest
            Cache-Control: no-store
          /service-worker.js
            Cache-Control: no-store
          # Everything below carries a content hash in its filename (scripts/hash_assets.py), so
          # the URL cannot outlive the bytes and there is nothing to revalidate: a change ships a
          # new address, and the old one is simply never asked for again.
          /config.*.js
            Cache-Control: public, max-age=31536000, immutable
          /styles.*.css
            Cache-Control: public, max-age=31536000, immutable
          /src/*
            Cache-Control: public, max-age=31536000, immutable
          /release-notes.json
            Cache-Control: public, max-age=0, must-revalidate
          HEADERS

          # Experimental deployments are shared by hand, never advertised: keep them out of
          # search results so a pilot can never arrive at a test build from a web search. They
          # also get their own icon colour and name, because both builds are installed on the
          # same phone and the wrong one must not be openable by accident.
          if [ -n "${CHANNEL}" ]; then
            printf '/*\n  X-Robots-Tag: noindex, nofollow\n' >> dist/site/_headers
            echo "channel '${CHANNEL}': marked noindex"
            # The dev branch is served at next.meetthecows.org, so it calls itself "next" on the
            # home screen. The internal channel value stays the branch name — that is what
            # suppresses the migration notice and what Settings shows a tester.
            LABEL="${CHANNEL}"
            [ "${CHANNEL}" = "dev" ] && LABEL="next"
            python3 scripts/apply_channel_branding.py --dir dist/site --channel "${LABEL}"
          fi
          cat dist/site/_headers

          # LAST, and after the channel rewrite on purpose. Every cache in the chain keys on the
          # URL, including the iOS home-screen icon cache that a delete-and-reinstall does not
          # clear, so each icon carries its own content hash. Stamping before the rewrite gave the
          # channel production's hash — a URL that then sat still while the channel icon changed
          # underneath it, which is the exact failure this is meant to prevent.
          python3 scripts/stamp_icon_urls.py --dir dist/site

          # And after that, because hashing seals a file's bytes. The shell is no-store and always
          # fresh; its code was not, and `max-age=0, must-revalidate` is revalidated by whichever
          # edge node the request lands on. For minutes after a deploy those nodes disagree — the
          # same URL returned two different bodies on alternating fetches — so a pilot could load
          # a new index.html against the previous build's app.js, a pairing nothing detects at
          # runtime. Content-addressed names make that combination unaskable rather than unlikely.
          python3 scripts/hash_assets.py --dir dist/site

      # --- GitHub Pages ------------------------------------------------------------------------
      # The default target, and — once DEPLOY_TARGET is 'cloudflare' — also the retired origin.
      # A retired origin still needs one last deploy: its copy of the shell is frozen at whatever
      # was published when the move happened, so it can only learn that the app has moved by being
      # handed a shell that already knows. deploy_retired_origin does exactly that, once, without
      # touching DEPLOY_TARGET and risking it being left pointed at the wrong host.
      # This replaces the whole site there, dropping any packs it still carries. That is intended:
      # the app reads packs from PACKS_BASE_URL now, and a retired origin should stop serving
      # 300 MB it no longer owns.
      - name: Setup Pages
        if: vars.DEPLOY_TARGET != 'cloudflare' || inputs.deploy_retired_origin
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: vars.DEPLOY_TARGET != 'cloudflare' || inputs.deploy_retired_origin
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist/site

      - name: Deploy to GitHub Pages
        id: deployment
        if: vars.DEPLOY_TARGET != 'cloudflare' || inputs.deploy_retired_origin
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # --- Cloudflare Pages (set repo variable DEPLOY_TARGET=cloudflare to switch over) -------
      # Direct upload, not a git-connected build: the heavy pack build stays here in Actions
      # with its caches and secrets, and Cloudflare only receives the finished directory.
      # --branch drives the URL: the production branch serves the custom domain, every other
      # branch gets its own <branch>.<project>.pages.dev alias — the experimental deployments.
      - name: Deploy to Cloudflare Pages
        id: cf
        if: vars.DEPLOY_TARGET == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT="${{ vars.CF_PAGES_PROJECT || 'meet-the-cows' }}"
          # Create the direct-upload project on first run. A create failure is NOT automatically
          # harmless: on accounts where Pages project creation is disabled (Pages is being folded
          # into Workers) it fails with API error 8000000, and blindly continuing produced a
          # confusing "project does not exist" error two steps later. Distinguish the cases.
          if ! npx --yes wrangler@latest pages project create "$PROJECT" --production-branch main; then
            if npx --yes wrangler@latest pages project list 2>/dev/null | grep -q "$PROJECT"; then
              echo "project '$PROJECT' already exists — continuing"
            else
              echo "::error::Pages project '$PROJECT' does not exist and could not be created."
              exit 1
            fi
          fi
          npx --yes wrangler@latest pages deploy dist/site \
            --project-name "$PROJECT" \
            --branch "${{ github.ref_name }}" \
            --commit-dirty=true

      # --- Cloudflare Workers (static assets) --------------------------------------------------
      # Both branches, one config, name chosen per branch — see deploy/wrangler.toml for why they
      # must not diverge. main -> meet-the-cows-app (app.meetthecows.org),
      # dev -> meet-the-cows-next (next.meetthecows.org).
      #
      # The Pages deploy below still runs for main while app.meetthecows.org is attached to the
      # Pages project. Once the custom domain moves to the Worker, the Pages step goes.
      - name: Deploy to Cloudflare Workers
        if: vars.DEPLOY_TARGET == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            WORKER="meet-the-cows-app"
          else
            WORKER="meet-the-cows-next"
          fi
          echo "Deploying ${{ github.ref_name }} to Worker '$WORKER'"
          npx --yes wrangler@latest deploy --config deploy/wrangler.toml --name "$WORKER"

      - name: Show URL
        run: |
          if [ "${{ vars.DEPLOY_TARGET }}" = "cloudflare" ]; then
            if [ "${{ github.ref_name }}" = "main" ]; then
              echo "Worker meet-the-cows-app  -> app.meetthecows.org"
            else
              echo "Worker meet-the-cows-next -> next.meetthecows.org"
            fi
            echo "Attach the custom domain in: Cloudflare -> Compute (Workers) -> <worker> -> Settings -> Domains & Routes"
          else
            echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
          fi
