name: Deploy app to Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "styles.css"
      - "release-notes.json"
      - "src/**"
      - "icons/**"
      - "scripts/fetch_pages_pack.py"
      - "scripts/make_pages_pack_index.py"
      - ".github/workflows/deploy-app.yml"
      - ".github/workflows/build-data-pack.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PACK_ID: fr-alps
      PACK_NAME: France / Alps
      PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # APP_VERSION is declared in both files (the SW cannot import the module); a mismatch
      # would leave clients on a stale shell cache. Fail fast instead of deploying drift.
      # Every release must also ship its release note: fail when release-notes.json has no
      # entry for the current APP_VERSION.
      - name: Check APP_VERSION consistency and release note
        run: |
          app=$(grep -o "APP_VERSION = '[^']*'" src/app.js | head -1)
          sw=$(grep -o "APP_VERSION = '[^']*'" service-worker.js | head -1)
          echo "src/app.js:        ${app}"
          echo "service-worker.js: ${sw}"
          [ -n "${app}" ] && [ "${app}" = "${sw}" ] || { echo "ERROR: APP_VERSION mismatch"; exit 1; }

          version=$(echo "${app}" | sed "s/.*'\(.*\)'/\1/")
          jq -e --arg v "${version}" '.[] | select(.version == $v)' release-notes.json > /dev/null \
            || { echo "ERROR: release-notes.json has no entry for ${version} — write the release note before deploying"; exit 1; }
          echo "release note present for ${version}"

      # This workflow ALWAYS deploys — it must not defer to build-data-pack.yml. An earlier
      # version skipped itself when data-pack files changed in the same push, assuming the data
      # workflow would deploy the complete site; but that workflow short-circuits when the pack
      # sources are unchanged, and the app shell never shipped (0.7.1-beta went out this way).
      # The shared pages-deploy concurrency group serializes the two workflows, so the rare
      # double deploy on a mixed push is harmless — the later run ships the same packs again.
      - name: Restore latest generated data pack cache
        uses: actions/cache/restore@v6
        with:
          path: data/packs
          key: pages-pack-${{ github.run_id }}
          restore-keys: |
            pages-pack-

      - name: Restore packs from current Pages deployment when cache is unavailable
        run: |
          if [ -f "data/packs/packs.json" ]; then
            echo "Using cached data packs."
            exit 0
          fi

          # Fetches every pack listed in packs.json plus the shared media tree.
          python3 scripts/fetch_pages_pack.py \
            --base-url "${PAGES_BASE_URL}" \
            --output data/packs

      - name: Assemble Pages site
        run: |
          mkdir -p dist/site/packs

          cp index.html styles.css service-worker.js manifest.webmanifest release-notes.json config.js dist/site/
          if [ -d icons ]; then cp -R icons dist/site/icons; fi
          mkdir -p dist/site/src
          cp src/app.js dist/site/src/app.js

          # All pack dirs + shared media (_shared) + packs.json.
          cp -R data/packs/. dist/site/packs/

          find dist/site -maxdepth 3 -type f | sort | head -80
          du -sh dist/site dist/site/packs

      # Deployment config is written per environment, overwriting the committed defaults (which
      # stay empty so a local checkout behaves like a plain single-origin site). Everything is
      # driven by repository variables, so no URL is hardcoded in the workflow.
      #   PACKS_BASE_URL      data origin for packs, e.g. https://data.meetthecows.org/ ('' = self)
      #   CANONICAL_APP_URL   production app URL; any other origin shows the migration notice
      #   SITE_URL            landing site, linked from that notice
      - name: Write deployment config
        env:
          PACKS_BASE_URL: ${{ vars.PACKS_BASE_URL }}
          CANONICAL_APP_URL: ${{ vars.CANONICAL_APP_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          CHANNEL: ${{ github.ref_name == 'main' && '' || github.ref_name }}
        run: |
          python - <<'PY' > dist/site/config.js
          import json, os
          cfg = {
              "packsBase": os.environ.get("PACKS_BASE_URL", ""),
              "canonicalAppUrl": os.environ.get("CANONICAL_APP_URL", ""),
              "siteUrl": os.environ.get("SITE_URL", ""),
              "channel": os.environ.get("CHANNEL", ""),
          }
          print("// Generated at deploy time — see config.js in the repo for the field docs.")
          print(f"self.MTC_CONFIG = {json.dumps(cfg, indent=2)};")
          PY
          cat dist/site/config.js

      # --- GitHub Pages (default) ------------------------------------------------------------
      - name: Setup Pages
        if: vars.DEPLOY_TARGET != 'cloudflare'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: vars.DEPLOY_TARGET != 'cloudflare'
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist/site

      - name: Deploy to GitHub Pages
        id: deployment
        if: vars.DEPLOY_TARGET != 'cloudflare'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # --- Cloudflare Pages (set repo variable DEPLOY_TARGET=cloudflare to switch over) -------
      # Direct upload, not a git-connected build: the heavy pack build stays here in Actions
      # with its caches and secrets, and Cloudflare only receives the finished directory.
      # --branch drives the URL: the production branch serves the custom domain, every other
      # branch gets its own <branch>.<project>.pages.dev alias — the experimental deployments.
      - name: Deploy to Cloudflare Pages
        id: cf
        if: vars.DEPLOY_TARGET == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy dist/site \
            --project-name "${{ vars.CF_PAGES_PROJECT || 'meet-the-cows' }}" \
            --branch "${{ github.ref_name }}" \
            --commit-dirty=true

      - name: Show URL
        run: |
          if [ "${{ vars.DEPLOY_TARGET }}" = "cloudflare" ]; then
            echo "Deployed to Cloudflare Pages (branch ${{ github.ref_name }})"
          else
            echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
          fi
