# Build the terrain tiles the app routes glides over, and publish them beside the packs.
#
# Deliberately manual and deliberately separate from the nightly pack build. The ground does not
# move: these tiles are rebuilt when the covered area changes or the DEM product does, not every
# night, and a run downloads several GB from Copernicus to produce ~90 MB of tiles.
name: Build terrain tiles

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "Bounding box as 'south west north east' in degrees. Empty = every configured region (see DEFAULT_BBOXES in build_terrain_tiles.py: Alps + Pyrenees)."
        type: string
        default: ""
      dem:
        description: "Copernicus product: glo30 (pooled 3x3, conservative) or glo90 (lighter)"
        type: choice
        options: [glo30, glo90]
        default: glo30
      publish:
        description: "Upload to R2 when done"
        type: boolean
        default: true
      force:
        description: "Rebuild tiles even when a cached copy exists"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terrain-build
  cancel-in-progress: false

jobs:
  build-terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        # rasterio only exists for this job — it is a heavy wheel and nothing else in the repo
        # reads a GeoTIFF.
        run: python -m pip install --quiet numpy rasterio boto3

      - name: Check the tile format
        run: python scripts/test_terrain_format.py

      # Same ref-decides-the-channel rule as build-data-pack: from main this publishes the
      # production terrain (packs/_terrain); from any other ref it publishes the dev channel's
      # copy (dev/packs/_terrain), which next.meetthecows.org reads. Tiles are byte-identical
      # across channels — the ground has no branches — so the split only exists so a terrain
      # change can be proven on the dev app before it reaches production. After a terrain
      # change ships: dispatch on dev to test, merge, dispatch on main to publish for real.
      - name: Resolve data channel
        id: channel
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "prefix=packs/_terrain" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=dev/packs/_terrain" >> "$GITHUB_OUTPUT"
          fi

      # Tiles are keyed by geography, not by build, so a re-run after a network failure should
      # resume rather than re-download the world.
      - name: Restore previously built tiles
        if: ${{ !inputs.force }}
        uses: actions/cache/restore@v6
        with:
          path: data/packs/_terrain
          key: terrain-${{ inputs.dem }}-${{ hashFiles('scripts/build_terrain_tiles.py', 'scripts/terrain_format.py') }}-${{ inputs.bbox || 'default' }}
          restore-keys: |
            terrain-${{ inputs.dem }}-${{ hashFiles('scripts/build_terrain_tiles.py', 'scripts/terrain_format.py') }}-
            terrain-${{ inputs.dem }}-

      # --merge-index-url keeps the written index a superset of what is already published: on a
      # cold cache a bbox-limited run rebuilds only its own region, and without the merge the
      # index would unlist every other region's tiles — the app treats an unlisted tile as gone.
      - name: Build tiles
        run: |
          python scripts/build_terrain_tiles.py \
            ${{ inputs.bbox != '' && format('--bbox {0}', inputs.bbox) || '' }} \
            --dem "${{ inputs.dem }}" \
            --out data/packs \
            --jobs 6 \
            ${{ vars.PACKS_BASE_URL != '' && format('--merge-index-url {0}{1}/index.json', vars.PACKS_BASE_URL, steps.channel.outputs.prefix) || '' }} \
            ${{ inputs.force && '--force' || '' }}

      # Named cols come from a different source on a different schedule, and a failure here must
      # not cost the tile build — the app falls back to a geometric description without them.
      - name: Fetch named cols and passes
        continue-on-error: true
        run: |
          python scripts/fetch_cols.py \
            ${{ inputs.bbox != '' && format('--bbox {0}', inputs.bbox) || '' }} \
            --out data/packs

      - name: Verify the tiles decode
        # A tile that the Python decoder cannot read is a tile no browser will read either, and
        # publishing it would put a hole in someone's terrain coverage.
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from terrain_format import decode, parse_tile_key

          root = Path("data/packs/_terrain")
          index = json.loads((root / "index.json").read_text())
          bad = kept = 0
          for entry in index["tiles"]:
              path = root / f"{entry['key']}.terr"
              if not path.exists():
                  # Merged from the published index (see --merge-index-url): already live and
                  # already serving, so there is nothing local to check — or to re-upload.
                  kept += 1
                  continue
              blob = path.read_bytes()
              try:
                  tile = decode(blob)
              except ValueError as error:
                  print(f"{entry['key']}: {error}", file=sys.stderr)
                  bad += 1
                  continue
              lat0, lon0 = parse_tile_key(entry["key"])
              if (tile.lat0, tile.lon0) != (lat0, lon0):
                  print(f"{entry['key']}: header says {tile.lat0},{tile.lon0}", file=sys.stderr)
                  bad += 1
          print(f"{index['tileCount']} tiles ({kept} kept from the published index), "
                f"{index['totalBytes']:,} bytes, {bad} bad")
          sys.exit(1 if bad else 0)
          PY

      - name: Save built tiles
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/packs/_terrain
          key: terrain-${{ inputs.dem }}-${{ hashFiles('scripts/build_terrain_tiles.py', 'scripts/terrain_format.py') }}-${{ inputs.bbox || 'default' }}

      - name: Publish to R2
        if: ${{ inputs.publish && vars.PACKS_BASE_URL != '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python scripts/publish_packs_r2.py \
            --dir data/packs/_terrain \
            --prefix "${{ steps.channel.outputs.prefix }}" \
            --bucket "${{ vars.R2_PACKS_BUCKET || 'mtc-packs' }}"

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          index = json.loads(Path("data/packs/_terrain/index.json").read_text())
          print("## Terrain tiles\n")
          print(f"- source: {index['source']}")
          print(f"- resolution: {index['resolutionArcSec']} arc-seconds ({index['samples']} samples per degree)")
          print(f"- tiles: {index['tileCount']}")
          print(f"- total: {index['totalBytes'] / 1024 / 1024:.1f} MB")
          cols = Path("data/packs/_terrain/cols.json")
          if cols.is_file():
              data = json.loads(cols.read_text())
              print(f"- named cols: {data['count']} ({cols.stat().st_size / 1024:.0f} KB)")
          else:
              print("- named cols: none (routes will be described geometrically)")
          PY
