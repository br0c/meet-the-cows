name: Generate field views

# Generated satellite views for outlanding fields, in three tiers:
#   osm    - a field with an OSM runway inside the match radius, geometry drawn as-is
#   aires  - Guide des Aires de Sécurité fields, drawn annotations transferred onto
#            current imagery (deterministic CV, no model call)
#   pyr    - the same for the APVV Guide des champs pyrénéens
#
# Dispatch-only and never wired to push: generation is a deliberate act, not something the
# nightly pack build should redo. Views are stable on purpose — a pilot who has studied one
# should not find it silently shifted — so a refresh happens when imagery campaigns update,
# roughly yearly, or when the pipeline itself improves.
#
# Structured as a pipeline of independent jobs rather than one long job, because the first
# monolithic version cost 2.5 hours of orthophoto fetching twice: once to a crash in a
# single field, once to a wrong secret name in the publish step. Now:
#
#   prepare  -> inventory, OSM runways, match            (~10 min, uploaded as an artifact)
#   render   -> matrix: one job per country shard + aires + pyr, fail-fast off
#   qa       -> automated review over every shard's index
#   publish  -> renders to R2, and runs even when a shard or QA failed
#
# So a failure costs its own shard, "re-run failed jobs" is genuinely useful, and a
# credential problem in publish can never destroy generation again.
on:
  workflow_dispatch:
    inputs:
      tiers:
        description: "Which tiers to run"
        type: choice
        default: all
        options: [all, osm, aires, pyr]
      channel:
        description: "Data channel to read the field inventory from"
        type: choice
        default: dev
        options: [dev, prod]
      limit:
        description: "Cap fields per shard (0 = no cap; use a small number to smoke-test)"
        type: string
        default: "0"
      publish:
        description: "Upload renders to R2 (off = artifacts only)"
        type: boolean
        default: true
      label_limit:
        description: "Cap photos sent to the label reader (0 = every uncached one)"
        type: string
        default: "0"

concurrency:
  group: field-views
  cancel-in-progress: false

env:
  PY_DEPS: opencv-python-headless numpy Pillow boto3

jobs:
  # ------------------------------------------------------------------ read labels
  # The guides letter each measured run with its own length and bearing, and that text is
  # the only thing that tells a drawn white arrow from a white road — ten geometric tests
  # were measured and every one fails (scripts/field_views_lab/white_arrows.py). Reading it
  # is the one model call in this pipeline, and it reads TEXT only; all geometry stays
  # deterministic CV.
  #
  # Answers are cached per photo in git, so this is normally a no-op that confirms coverage
  # and costs nothing. It is a separate job that is allowed to fail: with no new labels the
  # renderers simply keep the runs they can see in ink, which is exactly today's output.
  labels:
    if: ${{ github.event.inputs.tiers == 'all' || github.event.inputs.tiers == 'aires' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --quiet --upgrade pip $PY_DEPS

      - name: Verify the reader without spending anything
        run: python scripts/test_field_views_labels.py

      - name: Report cache coverage
        run: python scripts/field_views_lab/read_labels.py --check

      - name: Read any photo not yet cached
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY not set; white arrows stay missing"
            exit 0
          fi
          python scripts/field_views_lab/read_labels.py --limit "${{ github.event.inputs.label_limit }}"

      # Uploaded rather than committed: a model's reading is reviewed before it becomes the
      # repo's answer, and the render below runs on whatever is already committed.
      - name: Upload label readings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-views-labels
          retention-days: 30
          if-no-files-found: warn
          path: data/sources/field-views/labels/**

  # ---------------------------------------------------------------------- prepare
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --quiet --upgrade pip $PY_DEPS

      - name: Build the field inventory
        run: |
          python scripts/field_views_lab/inventory.py \
            --channel "${{ github.event.inputs.channel }}" --out work/inventory.json

      # Overpass and the match run once for every shard, so they belong here rather than
      # repeated per country.
      - name: Fetch OSM runways and match
        if: ${{ github.event.inputs.tiers == 'all' || github.event.inputs.tiers == 'osm' }}
        run: |
          python scripts/field_views.py runways --fields work/inventory.json \
            --out work/runways.json
          python scripts/field_views.py match --fields work/inventory.json \
            --runways work/runways.json --out work/matches.json

      # One shard per country for the OSM tier: the countries are independent, each talks
      # to a different national service (politer than hammering all six at once), and the
      # whole tier no longer stands or falls together. CH and AT are small enough to share.
      - name: Plan the render shards
        id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          tiers = os.environ["TIERS"]
          shards = []
          if tiers in ("all", "osm"):
              for name, countries in (("osm-FR", "FR"), ("osm-DE", "DE"), ("osm-IT", "IT"),
                                      ("osm-ES", "ES"), ("osm-CH-AT", "CH,AT")):
                  shards.append({"tier": "osm", "name": name, "countries": countries})
          if tiers in ("all", "aires"):
              shards.append({"tier": "aires", "name": "aires", "countries": ""})
          if tiers in ("all", "pyr"):
              shards.append({"tier": "pyr", "name": "pyr", "countries": ""})
          print("shards=" + json.dumps(shards))
          PY
        env:
          TIERS: ${{ github.event.inputs.tiers }}

      - uses: actions/upload-artifact@v4
        with:
          name: field-views-prepare
          retention-days: 5
          path: work/*.json

  # ----------------------------------------------------------------------- render
  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false          # a bad shard must not cancel its siblings
      max-parallel: 3           # be a guest on public WMS services, not a crowd
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --quiet --upgrade pip $PY_DEPS

      - uses: actions/download-artifact@v4
        with:
          name: field-views-prepare
          path: work

      # Renderers skip a field whose view is already on disk, so a restored cache turns a
      # rerun into a resume rather than a restart.
      - name: Cache this shard's renders
        uses: actions/cache@v6
        with:
          path: work
          key: fv-${{ github.event.inputs.channel }}-${{ matrix.shard.name }}-${{ github.run_id }}
          restore-keys: |
            fv-${{ github.event.inputs.channel }}-${{ matrix.shard.name }}-

      - name: Render ${{ matrix.shard.name }}
        env:
          FIELD_VIEWS_WORK: ${{ github.workspace }}/work
        run: |
          case "${{ matrix.shard.tier }}" in
            osm)
              python scripts/field_views_lab/osm_render_all.py \
                --matches work/matches.json --workers 4 \
                --limit "${{ github.event.inputs.limit }}" \
                --countries "${{ matrix.shard.countries }}" \
                --shard "${{ matrix.shard.name }}" ;;
            aires) python scripts/field_views_lab/aires_render.py \
                     $([ "${{ github.event.inputs.limit }}" != "0" ] && echo "${{ github.event.inputs.limit }}") ;;
            pyr)   python scripts/field_views_lab/pyr_transfer.py \
                     $([ "${{ github.event.inputs.limit }}" != "0" ] && echo "${{ github.event.inputs.limit }}") ;;
          esac

      - name: Upload ${{ matrix.shard.name }} renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-views-renders-${{ matrix.shard.name }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            work/${{ matrix.shard.tier }}/out/**

  # --------------------------------------------------------------------------- qa
  qa:
    needs: [prepare, render]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      blocking: ${{ steps.review.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --quiet --upgrade pip $PY_DEPS

      - uses: actions/download-artifact@v4
        with:
          name: field-views-prepare
          path: work
      # Shard artifacts merge back into one work tree: each wrote only its own tier dir.
      - uses: actions/download-artifact@v4
        with:
          pattern: field-views-renders-*
          merge-multiple: true
          path: work

      # The OSM shards each wrote their own index; fold them into one per tier so QA and
      # the sheets see the whole tier.
      - name: Merge shard indexes
        env:
          FIELD_VIEWS_WORK: ${{ github.workspace }}/work
        run: python scripts/field_views_lab/merge_indexes.py

      - name: Automated QA review
        id: review
        continue-on-error: true          # findings are reported here, enforced by the gate
        env:
          FIELD_VIEWS_WORK: ${{ github.workspace }}/work
        run: python scripts/field_views_lab/qa_review.py

      - name: Build contact sheets
        if: always()
        env:
          FIELD_VIEWS_WORK: ${{ github.workspace }}/work
        run: |
          for tier in osm aires pyr; do
            case "$tier" in
              osm)   title="OSM tier" ;;
              aires) title="Guide des Aires de Sécurité" ;;
              pyr)   title="APVV Pyrénées" ;;
            esac
            [ -d "work/$tier/out" ] || continue
            python scripts/field_views_lab/contact_sheets.py \
              --dir "work/$tier/out" --out "work/sheets/$tier" --title "$title"
          done
          # Sheets of just the flagged views — where a human's attention is worth spending.
          if [ -d work/qa/flagged ]; then
            python scripts/field_views_lab/contact_sheets.py \
              --dir work/qa/flagged --out work/sheets/flagged \
              --title "QA flagged — review these"
          fi

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Generated field views"
            echo
            echo "| tier | views |"
            echo "|---|---:|"
            for tier in osm aires pyr; do
              [ -d "work/$tier/out" ] || continue
              n=$(find "work/$tier/out" -name 'final_*.jpg' | wc -l)
              echo "| $tier | $n |"
            done
            echo
            if [ -f work/qa_flagged.txt ]; then
              echo "### QA findings (first 40)"
              echo '```'
              head -40 work/qa_flagged.txt
              echo '```'
            fi
            echo "Renders: R2 \`${{ github.event.inputs.channel }}/views/\`. Contact sheets in this run's artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-views-review
          retention-days: 30
          if-no-files-found: warn
          path: |
            work/sheets/**
            work/*/out/index.json
            work/pyr/out/verdicts.json
            work/qa_report.json
            work/qa_flagged.txt
            work/matches.json

  # ---------------------------------------------------------------------- publish
  # Runs even when a shard or QA failed: whatever rendered correctly is worth having, and
  # the run's red status carries the warning. Decoupled from render on purpose — the
  # publish step once failed on a wrong secret name and cost a full regeneration.
  publish:
    needs: [render, qa]
    if: ${{ always() && github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --quiet boto3

      - uses: actions/download-artifact@v4
        with:
          pattern: field-views-renders-*
          merge-multiple: true
          path: work

      - name: Publish renders to R2
        env:
          # CLOUDFLARE_ACCOUNT_ID is the name this repo's secret actually has — see
          # build-data-pack.yml; publish_packs_r2.py reads it as the R2_ACCOUNT_ID fallback.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUCKET: ${{ vars.R2_PACKS_BUCKET || 'mtc-packs' }}
        run: |
          prefix="views"
          [ "${{ github.event.inputs.channel }}" = "prod" ] || prefix="${{ github.event.inputs.channel }}/views"
          mkdir -p publish
          for tier in osm aires pyr; do
            [ -d "work/$tier/out" ] || continue
            mkdir -p "publish/$tier"
            find "work/$tier/out" -name 'final_*.jpg' -exec cp {} "publish/$tier/" \;
            for idx in work/$tier/out/index*.json; do
              [ -f "$idx" ] && cp "$idx" "publish/$tier/"
            done
          done
          n=$(find publish -name '*.jpg' | wc -l)
          echo "publishing $n renders to $prefix"
          [ "$n" -gt 0 ] || { echo "nothing to publish"; exit 0; }
          python scripts/publish_packs_r2.py --dir publish --prefix "$prefix" --bucket "$BUCKET"

  # ------------------------------------------------------------------------- gate
  # The last word on the run's status, set after everything above has saved its work.
  gate:
    needs: [prepare, render, qa, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          bad=""
          [ "${{ needs.prepare.result }}" = "failure" ] && bad="$bad prepare"
          [ "${{ needs.render.result }}" = "failure" ] && bad="$bad render(one-or-more-shards)"
          [ "${{ needs.qa.result }}" = "failure" ] && bad="$bad qa"
          [ "${{ needs.publish.result }}" = "failure" ] && bad="$bad publish"
          [ "${{ needs.qa.outputs.blocking }}" = "failure" ] && bad="$bad qa-blocking-findings"
          if [ -n "$bad" ]; then
            echo "attention needed:$bad"
            echo "Renders and review artifacts were still saved — see the qa job's summary."
            exit 1
          fi
          echo "all shards rendered, QA clean, renders published"
