# Landing site (meetthecows.org) — deliberately a SEPARATE Cloudflare Pages project from the
# app. Different origin means it can never share a service-worker scope, cache or localStorage
# with the PWA at app.meetthecows.org, which is the whole reason the app and the marketing page
# are not just two paths on one host.
name: Deploy landing site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Static files only; nothing to deploy until Cloudflare is the target.
    if: vars.DEPLOY_TARGET == 'cloudflare'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT="${{ vars.CF_SITE_PROJECT || 'meet-the-cows-site' }}"
          # Created on first run, as for the app project (the dashboard offers no Pages option).
          npx --yes wrangler@latest pages project create "$PROJECT" --production-branch main \
            || echo "project '$PROJECT' already exists — continuing"
          npx --yes wrangler@latest pages deploy site \
            --project-name "$PROJECT" \
            --branch "${{ github.ref_name }}" \
            --commit-dirty=true

      - name: Show URL
        run: echo "Landing site deployed (branch ${{ github.ref_name }})"
