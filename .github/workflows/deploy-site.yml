# Landing site (meetthecows.org). Deployed as a Worker serving static assets rather than a
# Pages project — see site/wrangler.toml for why — but still its own deployment, so the page
# and the PWA at app.meetthecows.org stay on different origins and cannot share a
# service-worker scope, cache or localStorage.
name: Deploy landing site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.DEPLOY_TARGET == 'cloudflare'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy to Cloudflare
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Show URL
        run: |
          echo "Landing site deployed."
          echo "Attach meetthecows.org to the 'meet-the-cows-site' Worker:"
          echo "  Cloudflare dashboard -> Compute (Workers) -> meet-the-cows-site -> Settings -> Domains & Routes -> Add custom domain"
