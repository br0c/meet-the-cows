<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-title" content="Meet The Cows" />
    <title>Meet The Cows</title>
    <meta name="description" content="Offline cockpit aid for glider pilots: nearby outlanding fields and airfields with distance, bearing, required glide ratio, notes, photos, and VAC documents. Not for primary navigation." />
    <!-- Points at the new home from every copy, including the retired github.io one: while the
         move is on, the old origin must tell search engines and link previews that the real
         address is elsewhere, not claim to be it. -->
    <link rel="canonical" href="https://app.meetthecows.org/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meet the Cows" />
    <meta property="og:title" content="Meet the Cows — outlanding field viewer for glider pilots" />
    <meta property="og:description" content="Offline cockpit aid showing nearby outlanding fields and airfields with distance, bearing, required glide ratio, notes, photos, and VAC documents. Not for primary navigation." />
    <meta property="og:url" content="https://app.meetthecows.org/" />
    <meta property="og:image" content="https://app.meetthecows.org/icons/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Meet the Cows — outlanding field viewer for glider pilots" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meet the Cows — outlanding field viewer for glider pilots" />
    <meta name="twitter:description" content="Offline cockpit aid showing nearby outlanding fields with distance, bearing, required glide ratio, notes, photos, and VAC documents. Not for primary navigation." />
    <meta name="twitter:image" content="https://app.meetthecows.org/icons/og-image.png" />
    <!-- iOS ignores manifest SVG icons for Add to Home Screen; without this it invents
         one from a screenshot, which makes two installed builds indistinguishable. -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <!-- iOS 18's Dark home-screen mode applies its own dark treatment to any icon that does not
         declare a dark variant, which crushed this one to near-black: white survived, everything
         else went to black. Declaring one stops that. It points at the SAME file on purpose —
         the icon is already legible on a dark ground, and the whole point of the channel's colour
         is that it stays recognisable however the home screen is set. -->
    <link rel="apple-touch-icon" sizes="180x180" media="(prefers-color-scheme: dark)" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <noscript>Meet the Cows needs JavaScript enabled.</noscript>
    <div id="app"></div>
    <!-- Deployment config (pack origin, canonical app URL, channel). Classic script so the
         service worker can importScripts() the very same file; must load before app.js. -->
    <script src="config.js"></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
