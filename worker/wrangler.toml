# Cloudflare Worker: contribution intake for Meet the Cows.
# Deploy:  cd worker && npm install && npx wrangler deploy
# Secrets (never commit): npx wrangler secret put GITHUB_TOKEN
#                         npx wrangler secret put TURNSTILE_SECRET
name = "mtc-contrib-intake"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Workers Logs. Declared here rather than toggled in the dashboard on purpose: this Worker is
# redeployed by .github/workflows/deploy-worker.yml on every push to main, and a deploy applies
# the config it is given — a dashboard toggle can be reverted by a later merge, silently, which
# is the worst way to lose a signal you thought you had.
#
# This is the only Worker in the repo worth observing. The site and app Workers serve static
# assets with no entry script, so nothing of theirs ever executes; here the failure paths are
# real and currently invisible — a contribution that cannot reach GitHub or R2, and the nightly
# repo backup below, which has no other way of telling anyone it stopped working.
#
# Sampling stays at 1: a handful of contributions a day plus one cron is nowhere near the point
# where volume matters. If logging is ever added, log outcomes — never request bodies, photo
# contents, coordinates, or anything derived from GITHUB_TOKEN or TURNSTILE_SECRET.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
REPO = "br0c/meet-the-cows"          # owner/repo the PR is opened against
BASE_BRANCH = "main"                 # branch PRs target
# CORS: comma-separated app origins. During the move to meetthecows.org the retired GitHub
# Pages origin stays listed so the old app keeps working until it is sunset.
ALLOWED_ORIGIN = "https://app.meetthecows.org,https://next.meetthecows.org,https://br0c.github.io"
GEO_RADIUS_M = "1000"                # within this of the field ⇒ geo-verified
MAX_PHOTO_BYTES = "15728640"         # 15 MB
MIN_PHOTO_LONG_EDGE = "2560"         # matches the pack image resize target
MAX_PHOTOS = "5"                     # per submission; the app's picker enforces the same limit
RELEASE_TAG = "contrib-originals"    # legacy release with pre-R2 photo originals (fallback path)
BACKUP_BRANCHES = "main,dev"         # branches the nightly repo snapshot covers

# Photo originals (originals/) + nightly repo snapshots (repo-backups/). The bucket stays
# PRIVATE: originals are served by this Worker's GET /originals/<key> route, and backups are
# not reachable from outside at all — no public bucket URL, no S3 credentials anywhere.
# The bucket must exist before deploying: R2 -> Create bucket -> "mtc-data".
[[r2_buckets]]
binding = "ORIGINALS"
bucket_name = "mtc-data"

[triggers]
crons = ["47 2 * * *"]               # nightly repo tarball snapshot into R2 (see backupRepo)
